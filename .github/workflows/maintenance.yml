# 定期清理（手動觸發）：重掃依賴漏洞、檢查站上外部連結是否失效，有問題就開 issue。
# 不設排程：public repo 60 天沒活動時 GitHub 會自動停用排程。到 Actions → Maintenance → Run workflow 手動跑。
name: Maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 依賴漏洞
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

      - name: 外部連結
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 --exclude '^mailto:' index.html README.md
          output: lychee.md
          fail: true

      - name: 有問題就開 issue（同名且未關閉的 issue 改成留言）
        if: steps.deny.outcome == 'failure' || steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          DENY: ${{ steps.deny.outcome }}
          LINKS: ${{ steps.links.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="定期清理發現問題"
          {
            echo "執行紀錄：$RUN_URL"
            echo
            echo "- 依賴漏洞（cargo-deny）：$DENY"
            echo "- 外部連結（lychee）：$LINKS"
            [ -f lychee.md ] && { echo; cat lychee.md; }
            echo
            echo "處理方式見 AGENTS.md 的「CI 失敗怎麼修」。"
          } > body.md
          num=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
          exit 1
