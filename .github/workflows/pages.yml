# 檢查 → 建置 → 發佈到 GitHub Pages。
# 四個檢查 job 並行，全部通過才建置；PR 只跑檢查與建置，不發佈。
# 第三方 action 一律釘 commit SHA（註解是版本）；Dependabot 會開 PR 更新。
# repo 的 Settings → Pages → Source 必須是「GitHub Actions」。
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deps:
    name: 依賴漏洞（cargo-deny）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources

  workflow-lint:
    name: workflow 安全（zizmor）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  secrets:
    name: 金鑰外洩（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: 結構與內容規則
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: vendor 與 js 檔案未被竄改
        run: |
          sha256sum -c --quiet vendor/SHA256SUMS || {
            echo "::error::vendor/ 或 js/ 的檔案與 vendor/SHA256SUMS 不符。若是刻意修改或升級，請執行 ./scripts/vendor-sums.sh 並把 vendor/SHA256SUMS 一起 commit"
            exit 1
          }

      - name: 預渲染與元件一致
        run: |
          cargo run -q --locked --features ssr --bin prerender
          git diff --exit-code index.html || { echo "::error::index.html 的預渲染內容過期，請在本機跑 ./build.sh 後一起 commit"; exit 1; }

      - name: 結構測試與內容規則
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: cargo test -q --locked --features ssr --test site_rules

      - name: 文件路徑沒有過期
        run: ./scripts/check-docs.sh

  build:
    name: 建置＋E2E 冒煙測試
    needs: [deps, workflow-lint, secrets, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 安裝 trunk 0.22.1（驗 sha256）
        run: |
          curl -fsSLo trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  trunk.tar.gz" | sha256sum -c -
          sudo tar -xzf trunk.tar.gz -C /usr/local/bin trunk
          rm trunk.tar.gz

      - name: 建置
        run: trunk build --release --locked

      - name: E2E 冒煙測試＋效能預算
        run: node tests/e2e/smoke.mjs

      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: 發佈
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
