# 檢查 → 建置 → 發佈到 GitHub Pages → 驗證線上網站。
# 四個檢查 job 並行，全部通過才建置；PR 只跑檢查與建置，不發佈。
# 發佈後對正式網址再跑一次 E2E：目標是「線上網站一直是好的」，不只是「這次 push 測過」。
# 第三方 action 一律釘 commit SHA（註解是版本）；Dependabot 會開 PR 更新。
# repo 的 Settings → Pages → Source 必須是「GitHub Actions」。
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deps:
    name: 依賴漏洞（cargo-deny）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources

  workflow-lint:
    name: workflow 安全（zizmor）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  secrets:
    name: 金鑰外洩（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: 結構與內容規則
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: vendor 與 js 檔案未被竄改
        run: |
          sha256sum -c --quiet vendor/SHA256SUMS || {
            echo "::error::vendor/ 或 js/ 的檔案與 vendor/SHA256SUMS 不符。若是刻意修改或升級，請執行 ./scripts/vendor-sums.sh 並把 vendor/SHA256SUMS 一起 commit"
            exit 1
          }

      - name: 預渲染與元件一致
        run: |
          cargo run -q --locked --features ssr --bin prerender
          git diff --exit-code index.html || { echo "::error::index.html 的預渲染內容過期，請在本機跑 ./build.sh 後一起 commit"; exit 1; }

      - name: 結構測試與內容規則
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: cargo test -q --locked --features ssr --test site_rules

      - name: 文件路徑沒有過期
        run: ./scripts/check-docs.sh

  build:
    name: 建置＋E2E 冒煙測試＋Lighthouse
    needs: [deps, workflow-lint, secrets, checks]
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.wasm.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: 安裝 trunk 0.22.1（驗 sha256）
        run: |
          curl -fsSLo trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1  trunk.tar.gz" | sha256sum -c -
          sudo tar -xzf trunk.tar.gz -C /usr/local/bin trunk
          rm trunk.tar.gz

      - name: 建置
        run: trunk build --release --locked

      - name: 記下這次的 wasm 檔名（發佈後用來確認線上已更新）
        id: wasm
        run: echo "name=$(basename dist/*_bg.wasm)" >> "$GITHUB_OUTPUT"

      - name: E2E 冒煙測試＋效能預算
        run: node tests/e2e/smoke.mjs

      # 無障礙（內含 axe-core）、最佳實務、SEO 必須滿分；效能在軟體 GPU 上不準，只列報告
      - name: Lighthouse（無障礙、最佳實務、SEO 滿分）
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx -y @lhci/cli@0.15.1 autorun || {
            echo "::error::Lighthouse 門檻未過。下載 artifact lighthouse 的 HTML 報告看哪一項扣分；常見是文字對比（style/site.css 的 --ice-2／--ice-3）或缺 alt"
            exit 1
          }

      - name: Lighthouse 分數寫進摘要
        if: always()
        run: |
          [ -f lhci/manifest.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("lhci/manifest.json"))
          print("### Lighthouse\n\n| 項目 | 分數 |\n|---|---|")
          for k, v in m[0]["summary"].items():
              note = "（軟體 GPU，僅供參考）" if k == "performance" else ""
              print(f"| {k} | {round(v * 100)}{note} |")
          PY

      - name: 上傳 Lighthouse 報告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: lhci/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: 發佈
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    name: 驗證線上網站
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      SITE: https://hohshen.github.io/hohshen/
      WASM: ${{ needs.build.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 等 CDN 換上這次的版本（最多 5 分鐘）
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$SITE" | grep -q "$WASM" && { echo "線上已是 $WASM"; exit 0; }
            sleep 10
          done
          echo "::error::5 分鐘後線上仍不是這次建置的 $WASM。到 Settings → Pages 確認來源是 GitHub Actions，或看 deploy job 的 log"
          exit 1

      - name: 對正式網址跑 E2E
        env:
          SMOKE_URL: ${{ env.SITE }}
        run: node tests/e2e/smoke.mjs

      - name: 上傳截圖
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-live
          path: tests/e2e/out/
          retention-days: 7
          if-no-files-found: ignore
